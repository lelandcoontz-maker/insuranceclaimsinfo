<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Source Sans Pro', 'Segoe UI', sans-serif">
          <defs>
            <linearGradient id="concreteGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c0bab0"/>
              <stop offset="100%" stop-color="#a8a298"/>
            </linearGradient>
            <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c4a87a"/>
              <stop offset="100%" stop-color="#a88a60"/>
            </linearGradient>
            <linearGradient id="naturalGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8a7a5e"/>
              <stop offset="100%" stop-color="#6a5c44"/>
            </linearGradient>
            <linearGradient id="slabPipe" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#8a5c2a"/>
              <stop offset="50%" stop-color="#b87333"/>
              <stop offset="100%" stop-color="#8a5c2a"/>
            </linearGradient>
            <pattern id="fillDots" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
              <rect width="10" height="10" fill="#b89868"/>
              <circle cx="3" cy="3" r="1" fill="#a08050" opacity="0.5"/>
              <circle cx="8" cy="7" r="1.2" fill="#a08050" opacity="0.4"/>
            </pattern>
            <pattern id="naturalDots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
              <rect width="12" height="12" fill="#7a6a50"/>
              <circle cx="4" cy="4" r="1.5" fill="#6a5a40" opacity="0.5"/>
              <circle cx="10" cy="9" r="1" fill="#6a5a40" opacity="0.4"/>
            </pattern>
            <pattern id="grassSlab" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
              <rect width="14" height="14" fill="#7a9a68"/>
              <line x1="4" y1="14" x2="5" y2="7" stroke="#8aaa78" stroke-width="1"/>
              <line x1="10" y1="14" x2="9" y2="8" stroke="#8aaa78" stroke-width="1"/>
            </pattern>
            <filter id="sh4" x="-5%" y="-5%" width="115%" height="115%">
              <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
            </filter>
            <marker id="aRed4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#c45028"/>
            </marker>
            <marker id="aDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
            </marker>
            <marker id="aDimR" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M 10 0 L 0 5 L 10 10 z" fill="#666"/>
            </marker>
          </defs>
          <rect x="0" y="0" width="960" height="55" fill="#1a2744" rx="10"/>
          <text x="480" y="25" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">SLAB-ON-GRADE CONSTRUCTION — PIPE LOCATIONS</text>
          <text x="480" y="44" text-anchor="middle" font-size="12" fill="#8aa4c8">Pipes within and beneath the slab are above the natural grade — they are not "underground"</text>
          <line x1="480" y1="60" x2="480" y2="575" stroke="#ccc" stroke-width="1.5" stroke-dasharray="8,4"/>
          <text x="240" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2744">SCENARIO A: Pipe Embedded IN the Slab</text>
          <rect x="20" y="360" width="100" height="18" fill="#888" rx="2" stroke="#666" stroke-width="1"/>
          <text x="70" y="373" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">STREET</text>
          <rect x="125" y="350" width="55" height="15" fill="#b0b0b0" rx="1" stroke="#999" stroke-width="1"/>
          <text x="153" y="362" text-anchor="middle" font-size="7" fill="#555" font-weight="600">SIDEWALK</text>
          <polygon points="185,350 185,365 260,340 260,330" fill="#a0a0a0" stroke="#888" stroke-width="1"/>
          <text x="222" y="356" text-anchor="middle" font-size="7" fill="#555" font-weight="600">DRIVEWAY</text>
          <line x1="20" y1="378" x2="460" y2="378" stroke="#5a4a30" stroke-width="2" stroke-dasharray="8,4"/>
          <text x="400" y="394" text-anchor="end" font-size="10" fill="#5a4a30" font-weight="700">▼ NATURAL GRADE</text>
          <rect x="200" y="275" width="240" height="103" fill="url(#fillDots)" stroke="#b89868" stroke-width="1"/>
          <text x="320" y="340" text-anchor="middle" font-size="11" fill="#7a6040" font-weight="700">ENGINEERED</text>
          <text x="320" y="355" text-anchor="middle" font-size="11" fill="#7a6040" font-weight="700">FILL DIRT</text>
          <text x="320" y="370" text-anchor="middle" font-size="9" fill="#8a7050">(compacted, brought</text>
          <text x="320" y="381" text-anchor="middle" font-size="9" fill="#8a7050">in, on building plans)</text>
          <rect x="200" y="248" width="240" height="30" fill="url(#concreteGrad)" stroke="#908880" stroke-width="1.5" filter="url(#sh4)"/>
          <text x="320" y="268" text-anchor="middle" font-size="11" fill="#555" font-weight="700">CONCRETE SLAB (4-6&quot;)</text>
          <rect x="270" y="255" width="80" height="10" fill="url(#slabPipe)" rx="3" stroke="#7a5020" stroke-width="1.5"/>
          <line x1="310" y1="252" x2="310" y2="225" stroke="#b87333" stroke-width="1.5"/>
          <rect x="255" y="200" width="110" height="28" rx="5" fill="#fff4e8" stroke="#b87333" stroke-width="1.5"/>
          <text x="310" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5c2a">PIPE IN SLAB</text>
          <rect x="200" y="240" width="240" height="10" fill="#e0d0c0" stroke="#c8b8a0" stroke-width="0.5"/>
          <text x="320" y="237" text-anchor="middle" font-size="8" fill="#888">FLOOR FINISH</text>
          <rect x="20" y="378" width="460" height="110" fill="url(#naturalDots)" stroke="none"/>
          <text x="110" y="430" text-anchor="middle" font-size="10" fill="#c0b090" font-weight="600">NATURAL SOIL</text>
          <text x="110" y="445" text-anchor="middle" font-size="10" fill="#c0b090" font-weight="600">(UNDISTURBED)</text>
          <rect x="20" y="370" width="180" height="10" fill="url(#grassSlab)"/>
          <line x1="185" y1="260" x2="185" y2="378" stroke="#2e7d32" stroke-width="1.5" marker-start="url(#aDimR)" marker-end="url(#aDim)"/>
          <rect x="140" y="300" width="50" height="38" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
          <text x="165" y="314" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="700">ABOVE</text>
          <text x="165" y="326" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="700">GRADE</text>
          <text x="165" y="335" text-anchor="middle" font-size="8" fill="#2e7d32">~12-24&quot;</text>
          <rect x="220" y="120" width="200" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
          <text x="320" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">Part of the building structure</text>
          <text x="320" y="156" text-anchor="middle" font-size="10" fill="#2e7d32">Embedded in the slab itself</text>
          <text x="320" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">NOT "underground" ✓</text>
          <text x="720" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2744">SCENARIO B: Pipe Beneath the Slab in Fill</text>
          <rect x="500" y="360" width="100" height="18" fill="#888" rx="2" stroke="#666" stroke-width="1"/>
          <text x="550" y="373" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">STREET</text>
          <rect x="605" y="350" width="55" height="15" fill="#b0b0b0" rx="1" stroke="#999" stroke-width="1"/>
          <text x="633" y="362" text-anchor="middle" font-size="7" fill="#555" font-weight="600">SIDEWALK</text>
          <polygon points="665,350 665,365 740,340 740,330" fill="#a0a0a0" stroke="#888" stroke-width="1"/>
          <text x="702" y="356" text-anchor="middle" font-size="7" fill="#555" font-weight="600">DRIVEWAY</text>
          <line x1="500" y1="378" x2="940" y2="378" stroke="#5a4a30" stroke-width="2" stroke-dasharray="8,4"/>
          <text x="880" y="394" text-anchor="end" font-size="10" fill="#5a4a30" font-weight="700">▼ NATURAL GRADE</text>
          <rect x="680" y="275" width="240" height="103" fill="url(#fillDots)" stroke="#b89868" stroke-width="1"/>
          <text x="800" y="325" text-anchor="middle" font-size="11" fill="#7a6040" font-weight="700">ENGINEERED</text>
          <text x="800" y="340" text-anchor="middle" font-size="11" fill="#7a6040" font-weight="700">FILL DIRT</text>
          <rect x="680" y="248" width="240" height="30" fill="url(#concreteGrad)" stroke="#908880" stroke-width="1.5" filter="url(#sh4)"/>
          <text x="800" y="268" text-anchor="middle" font-size="11" fill="#555" font-weight="700">CONCRETE SLAB (4-6&quot;)</text>
          <rect x="750" y="295" width="80" height="10" fill="url(#slabPipe)" rx="3" stroke="#7a5020" stroke-width="1.5"/>
          <line x1="790" y1="295" x2="790" y2="225" stroke="#b87333" stroke-width="1.5"/>
          <rect x="725" y="200" width="130" height="28" rx="5" fill="#fff4e8" stroke="#b87333" stroke-width="1.5"/>
          <text x="790" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5c2a">PIPE UNDER SLAB</text>
          <text x="790" y="315" text-anchor="middle" font-size="8" fill="#8a5c2a">(in compacted fill)</text>
          <rect x="680" y="240" width="240" height="10" fill="#e0d0c0" stroke="#c8b8a0" stroke-width="0.5"/>
          <text x="800" y="237" text-anchor="middle" font-size="8" fill="#888">FLOOR FINISH</text>
          <rect x="500" y="378" width="440" height="110" fill="url(#naturalDots)" stroke="none"/>
          <text x="590" y="430" text-anchor="middle" font-size="10" fill="#c0b090" font-weight="600">NATURAL SOIL</text>
          <text x="590" y="445" text-anchor="middle" font-size="10" fill="#c0b090" font-weight="600">(UNDISTURBED)</text>
          <rect x="500" y="370" width="180" height="10" fill="url(#grassSlab)"/>
          <line x1="665" y1="300" x2="665" y2="378" stroke="#2e7d32" stroke-width="1.5" marker-start="url(#aDimR)" marker-end="url(#aDim)"/>
          <rect x="613" y="325" width="58" height="38" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
          <text x="642" y="339" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="700">STILL</text>
          <text x="642" y="351" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="700">ABOVE</text>
          <text x="642" y="361" text-anchor="middle" font-size="8" fill="#2e7d32">GRADE</text>
          <rect x="700" y="120" width="200" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
          <text x="800" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">In fill dirt — a building element</text>
          <text x="800" y="156" text-anchor="middle" font-size="10" fill="#2e7d32">Above natural grade, not in ground</text>
          <text x="800" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">NOT "underground" ✓</text>
          <rect x="60" y="500" width="840" height="58" rx="8" fill="#fff4ec" stroke="#c45028" stroke-width="1.5"/>
          <text x="480" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#c45028">In both scenarios, the pipe is above the natural grade, within the building's construction envelope.</text>
          <text x="480" y="538" text-anchor="middle" font-size="12" font-weight="700" fill="#c45028">"In the dirt" is not the same as "underground." The fill dirt is a building element, not natural ground.</text>
          <text x="480" y="554" text-anchor="middle" font-size="11" fill="#c45028">The "underground pipe" or "water below the surface of the ground" exclusion should not apply.</text>
          <text x="480" y="610" text-anchor="middle" font-size="9" fill="#aaa">© 2026 Leland Coontz, Licensed Public Adjuster • All rights reserved</text>
        </svg>
